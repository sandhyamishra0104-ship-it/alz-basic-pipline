trigger:
  - main

pool:
  name: Default

variables:
  terraformVersion: '1.9.8'
  serviceConnection: 'Azure-CloudOps-Connection'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)\environments\dev'

stages:

# ============================================================
# STAGE 1 - TERRAFORM VALIDATION & SECURITY
# ============================================================

- stage: Validate
  displayName: 'Terraform Validate & Security'

  jobs:
  - job: TerraformValidation
    displayName: 'Terraform Validation'

    steps:

    # --------------------------------------------------------
    # 1. Checkout Repository
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Repository'

    # --------------------------------------------------------
    # 2. Install Terraform
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        $terraformVersion = "$(terraformVersion)"
        $url = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

        $tempZip = "$(Agent.TempDirectory)\terraform.zip"
        $terraformDir = "$(Agent.TempDirectory)\terraform"

        Write-Host "Downloading Terraform $terraformVersion..."

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $tempZip

        if (Test-Path $terraformDir) {
          Remove-Item $terraformDir -Recurse -Force
        }

        New-Item -ItemType Directory -Path $terraformDir | Out-Null

        Expand-Archive `
          -Path $tempZip `
          -DestinationPath $terraformDir `
          -Force

        Write-Host "Terraform installed."

        & "$terraformDir\terraform.exe" version

        Write-Host "##vso[task.setvariable variable=TerraformExe]$terraformDir\terraform.exe"

      displayName: 'Install Terraform'

    # --------------------------------------------------------
    # 3. Terraform Format
    # --------------------------------------------------------

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Running Terraform format..."

        & "$(TerraformExe)" fmt -recursive "$(Build.SourcesDirectory)"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform fmt failed."
          exit 1
        }

        Write-Host "Terraform formatting completed."

      displayName: 'Terraform Format'

    # --------------------------------------------------------
    # 4. Terraform Init
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Working directory:"
          Get-Location

          Write-Host "Terraform version:"
          & "$(TerraformExe)" version

          Write-Host "Initializing Terraform..."

          & "$(TerraformExe)" init -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
          }

          Write-Host "Terraform init completed successfully."

    # --------------------------------------------------------
    # 5. Terraform Validate
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(terraformWorkingDirectory)"

        Write-Host "Running Terraform validate..."

        & "$(TerraformExe)" validate

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed."
          exit 1
        }

        Write-Host "Terraform validation successful."

      displayName: 'Terraform Validate'

    # --------------------------------------------------------
    # 6. Install TFLint
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        $version = "0.59.1"

        $zip = "$(Agent.TempDirectory)\tflint.zip"

        $dir = "$(Agent.TempDirectory)\tflint"

        $url = "https://github.com/terraform-linters/tflint/releases/download/v$version/tflint_windows_amd64.zip"

        Write-Host "Downloading TFLint..."

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $zip

        if (Test-Path $dir) {
          Remove-Item $dir -Recurse -Force
        }

        New-Item -ItemType Directory -Path $dir | Out-Null

        Expand-Archive `
          -Path $zip `
          -DestinationPath $dir `
          -Force

        & "$dir\tflint.exe" --version

        Write-Host "##vso[task.setvariable variable=TFLintExe]$dir\tflint.exe"

      displayName: 'Install TFLint'

    # --------------------------------------------------------
    # 7. TFLint Configuration
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Set-Location "$(terraformWorkingDirectory)"

        if (Test-Path "$(Build.SourcesDirectory)\.tflint.hcl") {

          Write-Host "TFLint configuration found."

          & "$(TFLintExe)" --init

          if ($LASTEXITCODE -ne 0) {
            Write-Warning "TFLint plugin initialization returned a warning."
          }

        }
        else {

          Write-Host "No .tflint.hcl found."
          Write-Host "Running TFLint with default configuration."

        }

      displayName: 'Initialize TFLint'

    # --------------------------------------------------------
    # 8. TFLint Scan
    # --------------------------------------------------------

    - powershell: |

        Set-Location "$(terraformWorkingDirectory)"

        Write-Host "Running TFLint security/code quality scan..."

        & "$(TFLintExe)" --recursive

        if ($LASTEXITCODE -ne 0) {

          Write-Warning "TFLint found issues."
          Write-Warning "Pipeline will continue because this is a non-blocking security check."

        }
        else {

          Write-Host "TFLint scan passed."

        }

      displayName: 'TFLint Scan'
      continueOnError: true

    # --------------------------------------------------------
    # 9. Install Checkov
    # --------------------------------------------------------

    - powershell: |

        $ErrorActionPreference = "Stop"

        Write-Host "Checking Python..."

        python --version

        Write-Host "Installing Checkov..."

        python -m pip install --upgrade pip

        python -m pip install checkov

        Write-Host "Checkov installation completed."

        checkov --version

      displayName: 'Install Checkov'

    # --------------------------------------------------------
    # 10. Checkov Security Scan
    # --------------------------------------------------------

    - powershell: |

        Set-Location "$(Build.SourcesDirectory)"

        Write-Host "Running Checkov Azure security scan..."

        checkov `
          -d . `
          --framework terraform `
          --soft-fail `
          --output cli `
          --output-file-path console

        if ($LASTEXITCODE -ne 0) {

          Write-Warning "Checkov returned security findings."
          Write-Warning "Findings are reported but will not block this pipeline."

        }
        else {

          Write-Host "Checkov security scan completed."

        }

      displayName: 'Checkov Security Scan'
      continueOnError: true

    # --------------------------------------------------------
    # 11. Terraform Plan
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |

          $ErrorActionPreference = "Stop"

          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Plan..."

          & "$(TerraformExe)" plan `
            -input=false `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
          }

          Write-Host "Terraform plan completed successfully."

    # --------------------------------------------------------
    # 12. Publish Terraform Plan
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'