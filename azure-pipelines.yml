trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  terraformVersion: '1.9.8'
  serviceConnection: 'Azure-CloudOps-Connection'
  terraformWorkingDirectory: '$(Build.SourcesDirectory)\environments\dev'

stages:

- stage: Terraform_Dev
  displayName: 'Terraform DEV - Security, Plan & Apply'

  jobs:

  - job: TerraformDev
    displayName: 'Terraform DEV'

    steps:

    - checkout: self
      displayName: 'Checkout Repository'

    - powershell: |
        $ErrorActionPreference = "Stop"

        $terraformVersion = "$(terraformVersion)"
        $url = "https://releases.hashicorp.com/terraform/$terraformVersion/terraform_${terraformVersion}_windows_amd64.zip"

        $zipPath = "$(Agent.TempDirectory)\terraform.zip"
        $terraformPath = "$(Agent.TempDirectory)\terraform"

        Write-Host "Installing Terraform $terraformVersion..."

        Invoke-WebRequest `
          -Uri $url `
          -OutFile $zipPath

        if (Test-Path $terraformPath) {
          Remove-Item $terraformPath -Recurse -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $terraformPath `
          -Force | Out-Null

        Expand-Archive `
          -Path $zipPath `
          -DestinationPath $terraformPath `
          -Force

        $terraformExe = "$terraformPath\terraform.exe"

        & $terraformExe version

        Write-Host "##vso[task.setvariable variable=TerraformExe]$terraformExe"

      displayName: 'Install Terraform'

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Running Terraform format check..."

        & "$(TerraformExe)" fmt -check -recursive "$(Build.SourcesDirectory)"

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform format check failed."
          exit 1
        }

        Write-Host "Terraform format check passed."

      displayName: 'Terraform Format Check'

    - task: UsePythonVersion@0
      displayName: 'Setup Python'
      inputs:
        versionSpec: '3.x'
        architecture: 'x64'

    - powershell: |
        $ErrorActionPreference = "Stop"

        Write-Host "Installing Checkov..."

        python --version

        python -m pip install --upgrade pip
        python -m pip install checkov

        Write-Host "Checkov version:"
        checkov --version

      displayName: 'Install Checkov'

    - powershell: |
        $ErrorActionPreference = "Continue"

        Write-Host "Running Checkov security scan..."

        Set-Location "$(Build.SourcesDirectory)"

        checkov `
          --directory "$(Build.SourcesDirectory)" `
          --framework terraform `
          --output cli `
          --soft-fail

        if ($LASTEXITCODE -ne 0) {
          Write-Warning "Checkov found security findings."
          Write-Warning "Pipeline will continue because soft-fail is enabled."
        }
        else {
          Write-Host "Checkov security scan passed."
        }

        exit 0

      displayName: 'Checkov Security Scan'

    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Working directory:"
          Get-Location

          Write-Host "Running Terraform Init..."

          & "$(TerraformExe)" init -input=false

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform init failed."
            exit 1
          }

          Write-Host "Terraform init completed successfully."

    - powershell: |
        $ErrorActionPreference = "Stop"

        Set-Location "$(terraformWorkingDirectory)"

        Write-Host "Running Terraform Validate..."

        & "$(TerraformExe)" validate

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed."
          exit 1
        }

        Write-Host "Terraform validation successful."

      displayName: 'Terraform Validate'

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Plan..."

          & "$(TerraformExe)" plan `
            -input=false `
            -var-file="terraform.tfvars" `
            -out="$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform plan failed."
            exit 1
          }

          Write-Host "Terraform plan completed successfully."

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)\tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

    - task: AzureCLI@2
      displayName: 'Terraform Apply - DEV'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Set-Location "$(terraformWorkingDirectory)"

          Write-Host "Running Terraform Apply..."

          & "$(TerraformExe)" apply `
            -input=false `
            -auto-approve `
            "$(Build.ArtifactStagingDirectory)\tfplan"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Terraform apply failed."
            exit 1
          }

          Write-Host "Terraform Apply completed successfully."